<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="style.css"><title>News – Paigen</title></head><body>
<div class="wrap ph"><span class="eye">News</span><h1>Gen Z news &amp; protests</h1><p>Explainers and reports from India and around the world, each with its source.</p></div>
<section style="padding-top:0"><div class="wrap"><div class="chips" id="chips"></div><div class="grid" id="g"></div>
<p class="note">Add your own stories in the <code>NEWS</code> list in <b>site.js</b>. Always verify facts and credit the original publisher.</p></div></section>
<script src="site.js"></script><script>
let fil="All";$("#chips").innerHTML=["All","India","International","Videos"].map(c=>`<button class="chip ${c===fil?"on":""}" data-c="${c}">${c}</button>`).join("");
function draw(){$("#g").innerHTML=NEWS.filter(n=>fil==="All"||n.cat===fil).map(newsCard).join("");tiltAll()}
$$(".chip").forEach(c=>c.onclick=()=>{fil=c.dataset.c;$$(".chip").forEach(x=>x.classList.toggle("on",x===c));draw()});draw();
</script></body></html>
